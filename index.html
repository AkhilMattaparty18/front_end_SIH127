<script>
    // Replace with your live Render backend URL or use localhost for development
    const API_BASE_URL = 'https://your-render-app-name.onrender.com';

    document.addEventListener("DOMContentLoaded", () => {
        // Load all dashboard components on page startup
        fetchDashboardStats();
        fetchRecentActivity();
        fetchAlertsList();

        // Bind search button / form event
        const searchBtn = document.getElementById("search-btn"); // Update with your actual search button ID
        if (searchBtn) {
            searchBtn.addEventListener("click", handleVehicleSearch);
        }
    });

    // 1. Fetch Top Metric Card Stats
    async function fetchDashboardStats() {
        try {
            const response = await fetch(`${API_BASE_URL}/api/dashboard/stats`);
            const result = await response.json();
            
            if (result.success) {
                const stats = result.data;
                document.getElementById("active-cameras-count").innerText = stats.active_cameras;
                document.getElementById("vehicles-detected-count").innerText = stats.vehicles_detected;
                document.getElementById("anpr-reads-count").innerText = stats.anpr_reads;
                document.getElementById("active-alerts-count").innerText = stats.active_alerts;
            }
        } catch (error) {
            console.error("Error fetching dashboard stats:", error);
        }
    }

    // 2. Fetch Recent ANPR Activity Table/List
    async function fetchRecentActivity() {
        try {
            const response = await fetch(`${API_BASE_URL}/api/dashboard/recent-activity`);
            const result = await response.json();
            
            if (result.success) {
                const activityContainer = document.getElementById("recent-activity-container"); // Update with your container ID
                if (!activityContainer) return;
                
                activityContainer.innerHTML = "";
                result.data.forEach(item => {
                    const row = document.createElement("div");
                    row.className = "activity-item";
                    row.innerHTML = `
                        <span><strong>Vehicle:</strong> ${item.vehicle_id}</span>
                        <span><strong>Camera:</strong> ${item.cam_id}</span>
                        <span><strong>Time:</strong> ${new Date(item.time_stamp).toLocaleString()}</span>
                    `;
                    activityContainer.appendChild(row);
                });
            }
        } catch (error) {
            console.error("Error fetching recent activity:", error);
        }
    }

    // 3. Fetch Alerts Section Sidebar Cards
    async function fetchAlertsList() {
        try {
            const response = await fetch(`${API_BASE_URL}/api/alerts`);
            const result = await response.json();
            
            if (result.success) {
                const alertsContainer = document.getElementById("alerts-sidebar-container"); // Update with your alerts container ID
                if (!alertsContainer) return;

                alertsContainer.innerHTML = "";
                result.data.forEach(alert => {
                    const alertCard = document.createElement("div");
                    alertCard.className = "alert-card";
                    alertCard.style.cursor = "pointer";
                    alertCard.innerHTML = `
                        <h4>Vehicle: ${alert.vehicle_id}</h4>
                        <p><strong>Reason:</strong> ${alert.blacklist_reason || "Security Alert"}</p>
                    `;
                    
                    // Click event to show theoretical timestamp path & map trail
                    alertCard.addEventListener("click", () => displayAlertDetails(alert));
                    alertsContainer.appendChild(alertCard);
                });
            }
        } catch (error) {
            console.error("Error fetching alerts list:", error);
        }
    }

    // 4. Handle Search Path Query (e.g., searching "TG01AB1234")
    async function handleVehicleSearch() {
        const inputField = document.getElementById("search-input"); // Update with your search box input ID
        if (!inputField) return;
        
        const vehicleId = inputField.value.trim();
        if (!vehicleId) return;

        try {
            const response = await fetch(`${API_BASE_URL}/api/track?vehicle_id=${encodeURIComponent(vehicleId)}`);
            const result = await response.json();

            if (result.success) {
                const pathData = result.data;
                console.log("Track Data Retrieved:", pathData);
                // TODO: Update your map markers and theoretical timestamp box here using pathData.trail
                renderTrailTimestamps(pathData.trail);
            } else {
                alert(result.message || "Vehicle path not found.");
            }
        } catch (error) {
            console.error("Error tracking vehicle:", error);
        }
    }

    // Helper: Display chronological timestamps and details when an alert or vehicle is clicked
    function renderTrailTimestamps(trailArray) {
        const timestampBox = document.getElementById("timestamp-path-box"); // Update with your theoretical box ID
        if (!timestampBox) return;

        timestampBox.innerHTML = "<h5>Detection Timeline</h5>";
        trailArray.forEach((point, index) => {
            const entry = document.createElement("div");
            entry.className = "timeline-entry";
            entry.innerHTML = `
                <p>#${index + 1} - <strong>Cam:</strong> ${point.cam_id} | <strong>Time:</strong> ${new Date(point.time_stamp).toLocaleString()}</p>
            `;
            timestampBox.appendChild(entry);
        });
    }

    function displayAlertDetails(alertData) {
        // Triggers path visualization on click for alert cards
        if (alertData.trail) {
            renderTrailTimestamps(alertData.trail);
        }
    }
</script>
