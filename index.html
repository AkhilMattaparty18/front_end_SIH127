<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ANPR Control Center - Real-time Alerts</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; display: flex; margin: 0; height: 100vh; }
        .main-panel { flex: 3; padding: 20px; }
        .alert-sidebar { flex: 1; background: #1e293b; color: white; padding: 15px; overflow-y: auto; border-left: 2px solid #334155; }
        #map { height: 500px; width: 100%; border-radius: 8px; }
        .alert-card { background: #0f172a; border-left: 5px solid #ef4444; padding: 12px; margin-bottom: 10px; border-radius: 4px; cursor: pointer; }
        .alert-card:hover { background: #334155; }
        .alert-title { font-weight: bold; color: #f87171; }
        .alert-time { font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>

<div class="main-panel">
    <h2>🚘 ANPR Real-time Tracking Panel</h2>
    <div id="map"></div>
</div>

<div class="alert-sidebar">
    <h3>🚨 Live Vehicle Alerts</h3>
    <div id="alertContainer">
        <!-- Live alerts appended here dynamically -->
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Socket.io Library -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script>
    const API_BASE_URL = "https://sirius-the-star.onrender.com";
    
    // Connect to Backend WebSocket
    const socket = io(API_BASE_URL);

    // Leaflet Setup
    let map = L.map('map').setView([17.4483, 78.3915], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    let layerGroup = L.layerGroup().addTo(map);

    // Listen for incoming WebSocket alerts
    socket.on('new_blacklist_alert', (alert) => {
        addAlertToFeed(alert);
    });

    function addAlertToFeed(alert) {
        const container = document.getElementById("alertContainer");
        const card = document.createElement("div");
        card.className = "alert-card";
        
        card.innerHTML = `
            <div class="alert-title">🚨 ${alert.vehicle_id}</div>
            <div><strong>Reason:</strong> ${alert.reason}</div>
            <div><strong>Cam ID:</strong> ${alert.location.cam_id}</div>
            <div class="alert-time">${new Date(alert.timestamp).toLocaleTimeString()}</div>
        `;

        // Click alert card to query full historical path from database and plot on Leaflet
        card.onclick = () => fetchAndPlotPath(alert.vehicle_id);

        container.prepend(card);
    }

    async function fetchAndPlotPath(vehicleId) {
        layerGroup.clearLayers();
        const response = await fetch(`${API_BASE_URL}/api/track?vehicle_id=${vehicleId}`);
        const result = await response.json();

        if (result.success) {
            const coords = [];
            result.data.trail.forEach((spot, idx) => {
                const point = [spot.latitude, spot.longitude];
                coords.push(point);
                L.marker(point).bindPopup(`Cam ${spot.cam_id}<br>${spot.time_stamp}`).addTo(layerGroup);
            });

            if (coords.length > 0) {
                const polyline = L.polyline(coords, { color: '#ef4444', weight: 4 }).addTo(layerGroup);
                map.fitBounds(polyline.getBounds(), { padding: [30, 30] });
            }
        }
    }
</script>
</body>
</html>
